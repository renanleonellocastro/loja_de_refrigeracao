packages:
  - apps/*
  - packages/*
# Supply chain: no git or tarball URLs deep in the tree and no package whose publishing trust went down.
# The one week wait before a new version is installed lives in renovate.json (minimumReleaseAge), where
# updates are proposed, so a pinned lockfile still installs.
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1 # published in 2023 before npm provenance existed; newer 7.x releases carry it
allowBuilds:
  esbuild: true
  vue-demi: true
# Advisories without a patched release that only reach build or dev tooling, never the production runtime.
# Reviewed on 2026-10-03; see docs/SEGURANCA.md section 5.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge via listhen (Nuxt dev server HTTPS helper)
    - GHSA-vfj7-8cjw-p6xm # braces via globby (Nitro build file scanning)
