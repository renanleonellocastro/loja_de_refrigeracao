name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/Sao_Paulo

jobs:
  quality:
    name: Lint, tipos, testes e cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: castro
          POSTGRES_PASSWORD: castro
          POSTGRES_DB: castro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U castro" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://castro:castro@localhost:5432/castro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' run build
      - name: OpenAPI e cliente gerado sem divergência
        run: pnpm --filter @rc/contracts generate && git diff --exit-code packages/contracts
      - run: pnpm lint
      - run: pnpm depcruise
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @rc/web run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: '**/coverage/'
          retention-days: 7

  e2e:
    name: E2E (celular, tablet, desktop)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: castro
          POSTGRES_PASSWORD: castro
          POSTGRES_DB: castro
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U castro" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025']
    env:
      E2E_ENGINES: ${{ github.event_name != 'pull_request' && github.event_name != 'push' && 'chromium,firefox,webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' run build
      - run: pnpm --filter @rc/e2e exec playwright install --with-deps ${E2E_ENGINES//,/ }
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  contract:
    name: Contrato (Schemathesis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: castro
          POSTGRES_PASSWORD: castro
          POSTGRES_DB: castro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U castro" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://castro:castro@localhost:5432/castro
      STORAGE_PATH: ./storage
      LOG_LEVEL: warn
      SCHEMATHESIS: schemathesis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' run build
      - name: Migrar e semear o banco
        run: pnpm --filter @rc/api seed
      - name: Subir a API
        working-directory: apps/api
        run: nohup node --import tsx --conditions=@rc/source src/server.ts > api.log 2>&1 &
      - run: curl --retry 30 --retry-connrefused --retry-delay 1 -fsS http://localhost:3001/health
      - run: pipx install schemathesis==4.29.3
      - name: Schemathesis anônimo e como gerente
        run: infra/schemathesis.sh http://localhost:3001
      - name: Log da API
        if: failure()
        run: cat apps/api/api.log

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The release age rule is enforced by Renovate (renovate.json), not by pnpm: see pnpm-workspace.yaml.
      - run: >-
          semgrep scan --error --metrics off
          --config p/javascript --config p/typescript --config p/nodejs --config p/owasp-top-ten
          --config p/secrets --config p/github-actions
          --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age

  lighthouse:
    name: Lighthouse e orçamento de JavaScript
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: castro
          POSTGRES_PASSWORD: castro
          POSTGRES_DB: castro
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U castro" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' run build
      - run: pnpm --filter @rc/web run build
      - name: API com os dados de exemplo e site em modo produção
        run: |
          nohup pnpm --filter @rc/api e2e:stack > api.log 2>&1 &
          PORT=3000 NUXT_PUBLIC_API_BASE=http://localhost:3001 nohup node apps/web/.output/server/index.mjs > web.log 2>&1 &
          curl --retry 90 --retry-connrefused --retry-delay 2 -fsS http://localhost:3001/health
          curl --retry 90 --retry-connrefused --retry-delay 2 -fsS -o /dev/null http://localhost:3000/
      - name: JavaScript inicial das páginas públicas (RNF-09, até 150 KB comprimido)
        run: node apps/web/scripts/check-bundle-size.mjs http://localhost:3000 / /produtos /produtos/compressor-embraco-1-4-hp /servicos
      # Mobile emulation with simulated 4G. The shared runner is noisier than a developer machine, so
      # performance asserts 90 here; the 95 of RNF-08 is measured locally and recorded in the pull request.
      - name: Lighthouse CI (desempenho, acessibilidade, boas práticas e SEO)
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse
          path: |
            apps/web/.lighthouseci/
            api.log
            web.log
          retention-days: 7

  secrets:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
