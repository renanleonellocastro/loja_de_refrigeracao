name: Capturas visuais

# Generates the Linux baselines for the @visual Playwright tests and commits them to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Atualizar capturas de referência
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' run build
      - run: pnpm --filter @rc/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @rc/e2e exec playwright test --grep @visual --update-snapshots
        env:
          E2E_API: '0'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/e2e
          git diff --cached --quiet || git commit -m "test(e2e): update linux visual baselines"
          git push
