name: Capturas visuais

# Generates the Linux baselines for the @visual Playwright tests and commits them to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Atualizar capturas de referência
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' run build
      - run: pnpm --filter @rc/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @rc/e2e exec playwright test --grep @visual --update-snapshots
        env:
          E2E_API: '0'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/e2e
          git diff --cached --quiet || git commit -m "test(e2e): update linux visual baselines"
          git push
