name: Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  title:
    name: Título do PR no padrão Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
