name: Teste de carga

# k6 load test of RNF-10 (docs/TESTES.md): manual only, before each release; never on pull requests.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: Tempo com os 50 usuários simultâneos (depois de 30 s de subida)
        default: 3m

permissions:
  contents: read

env:
  TZ: America/Sao_Paulo

jobs:
  k6:
    name: k6 (50 usuários, 10 mil produtos, 50 mil pedidos)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: castro
          POSTGRES_PASSWORD: castro
          POSTGRES_DB: castro
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U castro" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      LOAD_DURATION: ${{ inputs.duration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make load
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: k6
          path: tools/load/results/
          retention-days: 30
