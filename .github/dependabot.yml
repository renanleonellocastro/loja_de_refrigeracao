# Weekly grouped updates so fixes for new advisories arrive as one pull request that runs the full CI.
# The cooldown keeps the one week wait before a new release is proposed (supply chain, docs/SEGURANCA.md);
# security updates skip it. Major versions come in their own pull requests because they may break code.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [infra]
    ignore:
      # FullCalendar 7 changes the locale imports and the types; the upgrade is tracked in an issue.
      - dependency-name: '@fullcalendar/*'
        update-types: [version-update:semver-major]
      # Vitest 5.0.4 and 5.0.5 report a branch that never runs in the web pages and break the 100% coverage.
      - dependency-name: vitest
        versions: ['5.0.4', '5.0.5']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['5.0.4', '5.0.5']
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels: [infra]
    groups:
      actions:
        patterns: ['*']
