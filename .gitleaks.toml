[extend]
useDefault = true

[allowlist]
description = "Development placeholders and test fixtures with fake credentials"
paths = [
  '''infra/env\.sample$''',
  '''infra/compose\.yaml$''',
  '''\.test\.ts$''',
  '''(^|/)apps/api/test/''',
  '''apps/api/src/infra/db/seed\.ts$''',
  '''apps/e2e/''',
  # Legacy REST client files from the removed Express server; tokens were signed with a local dev secret.
  '''^server/test/.*\.http$''',
]
